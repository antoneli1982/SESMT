<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000f2a">
  <title>Gestão de Estoque EPI | SESÉ</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f2f6fc;font-family:Arial,sans-serif;color:#000f2a}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .loading strong{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:12px;color:#4e6383}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div><strong>Gestão EPI SESÉ</strong><span>Carregando a versão atualizada...</span></div></div>
  <script>
    (async () => {
      const response = await fetch("./app-base.html?v=20260812-excel-2", { cache: "no-store" });
      if (!response.ok) throw new Error(`Falha ao carregar a aplicação: ${response.status}`);
      let html = await response.text();
      const patchScript = '<script src="excel-patch.js?v=20260812-excel-2"><\\/script>';
      html = html.replace("</body>", patchScript + "</body>");
      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      console.error(error);
      document.getElementById("loading").innerHTML = '<div><strong>Não foi possível carregar a ferramenta.</strong><span>Atualize a página. Se persistir, verifique a conexão.</span></div>';
    });
  </script>
</body>
</html>
